# Render Blueprint — الخطة المجانية (free): لا تكلفة.
# ملاحظات مهمة:
#  - الخدمة المجانية تنام بعد 15 دقيقة بلا طلبات HTTP؛ البوت يرسل ping ذاتيًا كل 10 دقائق (RENDER_EXTERNAL_URL).
#    للأمان الإضافي أضف مراقبًا مجانيًا (UptimeRobot / cron-job.org) على: https://<اسم-خدمتك>.onrender.com/health كل 5 دقائق.
#  - لا يوجد قرص دائم في الخطة المجانية: عند كل إعادة تشغيل يُعاد تنزيل التاريخ (مجانًا من Dukascopy) وإعادة بناء السجل الذاتي تلقائيًا.
#    (للاحتفاظ بالسجل بين النشرات استخدم plan: starter مع القسم disk أدناه.)
services:
  - type: web
    name: gold-signals-bot
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    # disk:                  # خطة مدفوعة فقط (starter+)
    #   name: bot-data
    #   mountPath: /app/data
    #   sizeGB: 1
    envVars:
      - {key: TELEGRAM_BOT_TOKEN, sync: false}
      - {key: TELEGRAM_ADMIN_IDS, sync: false}
      - {key: TELEGRAM_CHANNEL_ID, sync: false}   # اختياري
      - {key: BOT_MODE, value: live}               # غيّره إلى paper للتجربة بدون إرسال
