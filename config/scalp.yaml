# ============================================================================
#  وضع السكالب على 15 دقيقة: أدخل واخرج بسرعة.
#  التفعيل:  GOLDBOT_PROFILE=scalp   أو   python -m goldbot run --profile scalp
#  يُدمج فوق config.yaml (يُغيّر المفاتيح المذكورة هنا فقط).
# ============================================================================

backtest:
  steps:
    15m: 1          # تقييم كل شمعة 15 دقيقة (لا نخطو فوق الشموع)
    5m: 2

# فريم السكالب الأساسي 15m: نبقي 5m للارتكاز والهيكل، ونمنع ضجيج 1m
strategies:
  min_score: 55     # أسهل قليلًا لالتقاط فرص أكثر على 15m
  require_htf_alignment: false   # السكالب لا يشترط موافقة 4H/1H: تخفّ إلى وزن فقط (صفقات قصيرة)

confluence:
  min_score: 45.0   # أقل من الافتراضي (50): سكالب على 15m يحتاج حساسية أعلى
  ignore_htf_conflict: true   # لا نمنع الإشارة لمجرد تعارض 4H/1H

filters:
  min_efficiency_ratio: 0.10   # نتقبّل تداولًا أكثر في اتجاهات 15m

risk:
  max_sl_atr: 2.2     # السكالب يقبل وقفًا أقرب
  rr1: 1.0
  rr2: 1.8
  min_rr2: 1.4        # عتبة ربح/مخاطرة أخفّ تناسب الأهداف السريعة

signals:
  cooldown_min: 10    # فرص أكثر على 15m
  max_open_trades: 1

tracking:
  scalp_max_minutes: 45   # خروج زمني: لا نُبقي الصفقة أكثر من 45 دقيقة (≈3 شموع 15m)
  scalp_min_r: 0.0
