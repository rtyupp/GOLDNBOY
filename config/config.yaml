# ============================================================================
#  إعدادات بوت GOLDNBOY للذهب XAU/USD.  المفاتيح السرية لا تُكتب هنا، بل في متغيرات البيئة:
#  TELEGRAM_BOT_TOKEN, TELEGRAM_ADMIN_IDS   (فقط! كل مصادر البيانات مجانية وبلا مفاتيح)
#  اختياري: TELEGRAM_CHANNEL_ID, BOT_MODE=live|paper, SIGNAL_TARGET
#  لا يوجد ذكاء اصطناعي ولا مصدر أخبار: القرار من الاستراتيجيات والمؤشرات وإدارة المخاطر فقط.
# ============================================================================
symbol: XAUUSD
mode: paper                 # آمن افتراضيًا: تسجيل فقط (لا ترسل إشارات). للتفعيل ضع متغير البيئة BOT_MODE=live أو غيّره هنا.

providers:                  # كل مزوّد بيانات قابل للاستبدال من هنا
  live: swissquote_public    # مصدر عام مجاني بلا API key؛ يبني شموع M1/M5 محليًا
  history: yahoo             # Yahoo Finance العام (GC=F ذهب آجل، ~4 أسابيع من 1m) — أكثر موثوقية من Dukascopy المحجوب غالبًا
  yahoo:
    url: https://query1.finance.yahoo.com/v8/finance/chart
    instrument: GC=F         # XAUUSD (فوري) غير متاح على Yahoo؛ GC=F يتبعه عن قرب
    timeout_sec: 20
    retries: 3
    pause_sec: 0.1
  dukascopy_node:
    instrument: xauusd
    timeout_sec: 300
    cache_dir: data/cache/dukascopy-node
  dukascopy:
    url: https://datafeed.dukascopy.com/datafeed    # الشهر في الرابط يبدأ من 00 (يعالجه الكود)
    instrument: XAUUSD
    price_scale: 1000
    workers: 3                # كان 6: الإفراط في الطلبات المتوازية يسبب HTTP 429
    timeout_sec: 15
    retries: 4
    pause_sec: 0.15           # فاصل بين الطلبات لتخفيف الضغط على الخادم المجاني
    abort_after_throttles: 8  # بعد 8 رفضات 429 متتالية نتوقف ونعيد المحاولة لاحقًا
    cache_dir: data/cache/duka  # كاش لكل ساعة مكتملة: لا يُعاد تنزيل ما نجح (يخفّف الحجب بعد إعادة التشغيل)
  swissquote:
    url: https://forex-data-feed.swissquote.com/public-quotes/bboquotes/instrument/XAU/USD
    poll_sec: 5
    reconnect_min_sec: 2
    reconnect_max_sec: 60
  oanda:
    instrument: XAU_USD
    rest_url: https://api-fxpractice.oanda.com
    stream_url: https://stream-fxpractice.oanda.com
    oanda_page_limit: 5000
    oanda_max_calls: 80
    oanda_reconnect_min_sec: 2
    oanda_reconnect_max_sec: 60
  csv: {csv_path: data/xauusd_1m.csv}

telegram:
  signal_target: private    # private = محادثتك الخاصة مع البوت | channel = القناة | both = الاثنان
  chart_tf: 5m
  chart_bars: 100

render:
  keepalive_min: 10         # على Render المجاني: ping ذاتي كل N دقيقة حتى لا ينام الخادم (يعمل تلقائيًا مع RENDER_EXTERNAL_URL)

data:
  max_tick_age_sec: 20      # أقدم من هذا = لا صفقة
  history_days: 30         # Yahoo يحتفظ بـ1m نحو 4 أسابيع فقط؛ الكاش المحلي يتراكم ليغطي أكثر مع مرور التشغيل
  min_history_rows: 500   # نحو 60 شمعة 4H؛ أقل من ذلك لا يبدأ التحليل
  history_retry_sec: 120    # يتضاعف عند تكرار الفشل (حتى 15 دقيقة)
  cache_dir: data/cache
  max_candle_gap_min: 5     # آخر شمعة 1m يجب أن تكون أحدث من هذا وإلا لا صفقة

analysis:
  use_ta_library: true      # مكتبة ta؛ إن لم تعمل يستخدم البوت صيغًا داخلية مكافئة
  swing_lr: 3
  cycle_offset_sec: 3       # تشغيل التحليل بعد إغلاق كل شمعة دقيقة بهذه الثواني

sessions:                   # ساعات UTC [بداية، نهاية). لا يوجد ضبط تلقائي للتوقيت الصيفي
  asia: [0, 8]
  london: [7, 16]
  new_york: [12, 21]
sessions_or_minutes: 30

filters:
  min_efficiency_ratio: 0.12
  allow_off_hours: false
  block_regimes: []          # حالات سوق (اتجاه 1H) تُمنع: مثلاً [TRANSITION, BEARISH]. اتركها فارغة لتعطيلها.
                             # دليل الاختبار (28 يومًا، بلا بوابة تقاطع): الانتقالي n=40 avgR=-0.34، الهابط n=27 avgR=-0.36
                             # بينما الصاعد n=11 avgR=+0.30 والعرضي n=7 avgR=+0.34. العينة صغيرة — جرّبها على بيانات أطول قبل الاعتماد.

news:                       # فلتر الأخبار الاقتصادية (مصدر مجاني بلا مفاتيح: ForexFactory weekly JSON)
  enabled: true
  url: https://nfs.faireconomy.media/ff_calendar_thisweek.json
  url_next: ""              # ForexFactory لم يعد ينشر endpoint للأسبوع القادم (404 دائم) — اتركه فارغًا. الأسابيع تُغطّى عند تجدّد thisweek.
  currencies: [USD, XAU]    # العملات/المعادن المؤثرة على الذهب
  impacts: [High]           # High = الأحداث الحمراء فقط (NFP, CPI, FOMC)
  block_before_min: 15      # لا إشارات قبل الخبر بـ15 دقيقة
  block_after_min: 15       # ولا بعد الخبر بـ15 دقيقة
  refresh_hours: 6
  timeout_sec: 15
  cache: data/cache/news.json

near_miss:                  # تنبيه «فرصة قاربت»: إعداد قوي مُنع بسبب بوابة (تنبيه فقط، ليس توصية)
  enabled: true
  score: 80                 # أبلغ فقط إذا بلغت درجة أفضل إعداد هذه العتبة
  cooldown_min: 60          # تهدئة لكل إعداد/اتجاه حتى لا يتكرر التنبيه

persistence:                # حفظ السجل (journal.sqlite) عبر Gist خاص ليبقى بعد كل إعادة نشر
  enabled: true             # يعمل تلقائيًا متى وُجد GITHUB_TOKEN (صلاحية gist)
  filename: goldbot-journal.sqlite
  description: GOLDNBOY journal backup (private)
  interval_min: 30          # رفع دوري كل 30 دقيقة + نسخة عند الإيقاف

strategies:
  enabled: [trend_pullback, liquidity_sweep, breakout, reversal, vwap, smc_ote_fvg, smc_sweep_mss_fvg, opening_range, round_number, liquidity_grab, silver_bullet]   # 11 استراتيجية: 5 كلاسيكية + SMC + ORB + أرقام مستديرة + سحب يومي + Silver Bullet
  min_score: 60
  require_htf_alignment: true   # نشترط موافقة الفريمات الكبيرة (4H/1H) لكل إعداد؛ وضع السكالب يخفّفها إلى وزن فقط
  round_number:
    step: 10.0            # خطوة الأرقام المستديرة للذهب ($10)؛ للأكبر استخدم 25 أو 50
  silver_bullet:
    windows: [[7, 8], [14, 15], [18, 19]]   # نوافذ ICT (UTC): افتتاح لندن، افتتاح نيويورك، وساعة NY الأخيرة (لا ضبط تلقائي للتوقيت الصيفي)

confluence:
  min_score: 68.4                # = 70 الأصلية بعد حذف بند الأخبار (5 نقاط): الدرجة صارت S×100/95 بدل S+5
  conflict_margin: 10

probability:
  min_samples: 30           # أقل من هذا = «غير كافٍ» ولا تظهر نسبة
  min_win_rate: 0.50
  min_avg_r: 0.0
  block_if_insufficient: false  # كان true: كان يحجب كل إشارة حتى يوجد 30 صفقة تاريخية مشابهة (السجل يُمسح على Render المجاني).
                                # الآن: إن وُجدت عينة كافية وكانت ضعيفة تُحجب، وإن لم توجد تمر الإشارة وتُكتب «غير كافٍ».

risk:
  sl_buffer_atr: 0.25
  min_sl_atr: 0.8
  max_sl_atr: 3.0
  rr1: 1.2
  rr2: 2.4
  min_rr2: 1.8
  max_spread: 0.8           # دولار
  max_spread_to_risk: 0.12
  tp_buffer_atr: 0.1

signals:
  cooldown_min: 15              # كان 30
  max_open_trades: 1

tracking:
  tp1_partial_pct: 0.5      # نسبة الإغلاق عند الهدف الأول (لحساب R)
  max_trade_minutes: 1440
  scalp_max_minutes: 0      # خروج زمني سريع (سكالب): 0 = معطّل؛ مثلاً 45 لإغلاق أي صفقة بعد 45 دقيقة
  scalp_min_r: 0.0          # أقل ربح (R) مقبول عند الخروج الزمني وإلا يُغلق بالسعر الحالي

bootstrap:                  # تهيئة ذاتية: Backtest يبني سجل «الاحتمال التاريخي» في عملية فرعية منخفضة الأولوية
  enabled: true
  days: 28                  # 1m من Yahoo متاح ~28 يومًا؛ ما فوقها لا يُجلَب فعليًا (سجل أطول يتراكم مع الكاش مع الوقت)
  tfs: [5m, 15m]            # يُخفَّض إلى 15m فقط على الذاكرة القليلة
  adaptive: true            # يقيس ذاكرة الحاوية ويضبط الأيام/الفريمات ويوقف التهيئة قبل أن تقتل Render الخدمة
  low_mem_days: 21          # 21 يومًا على الذاكرة القليلة: المحلل يحتاج 60 شمعة 4H ≈ 10 أيام، وأقل من 21 يُنتج صفقات قليلة جدًا
  min_days: 16              # أرضية صارمة: لا تُبنى تهيئة أقصر من هذا مهما قلّت الذاكرة (أقصر = 0 صفقات)
  min_free_mb: 150          # لا تبدأ التهيئة إن كان المتاح أقل من هذا
  min_trades: 8             # 28 يومًا (حد 1m) تُنتج ~30 صفقة و21 يومًا ~10، فالعتبة يجب أن تكون قابلة للتحقيق وإلا يُعاد البناء كل تشغيل (150 كان مستحيلًا)
  refresh_days: 7           # تحديث السجل التاريخي كل أسبوع
  timeout_sec: 5400
  marker: data/bootstrap.json

backtest:
  spread: 0.30              # دولار (التاريخ بلا bid/ask)
  slippage_entry: 0.10      # انزلاق الدخول بالدولار (أسوأ من السعر المخطط)
  slippage_stop: 0.15       # انزلاق إضافي عند ضرب وقف الخسارة (أوامر Stop تنزلق؛ أهداف Limit لا)
  history_days: 28         # حد 1m في Yahoo (~28 يومًا)
  steps: {1m: 5, 5m: 1, 15m: 1}
  report_dir: reports

assist:                     # مساعد DeepSeek: شرح الإشارة + ملخص يومي/أسبوعي + إجابة الأسئلة. لا يقرر ولا يغيّر الصفقات.
  enabled: true             # يعمل تلقائيًا متى وُجد DEEPSEEK_API_KEY في البيئة (بدونه يصمت)
  base_url: https://api.deepseek.com
  model: deepseek-v4-flash  # أسماء deepseek-chat/reasoner أُلغيت في 2026-07-24؛ يمكن تجاوزه بمتغير DEEPSEEK_MODEL
  timeout_sec: 25
  max_tokens: 900
  max_calls_per_day: 150    # سقف تكلفة يومي
  summary_hour_utc: 20      # الملخص اليومي (والأسبوعي أيام الجمعة) بعد إغلاق لندن/نيويورك تقريبًا

resources:
  gc_at: 0.75               # تنظيف الذاكرة عند هذه النسبة من حد الحاوية

paths:
  journal: data/journal.sqlite
  log_dir: logs
log_level: INFO
