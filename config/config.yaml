# ============================================================================
#  إعدادات بوت الذهب XAU/USD.  المفاتيح السرية لا تُكتب هنا، بل في متغيرات البيئة:
#  TELEGRAM_BOT_TOKEN, TELEGRAM_ADMIN_IDS   (فقط! كل مصادر البيانات مجانية وبلا مفاتيح)
#  اختياري: TELEGRAM_CHANNEL_ID, BOT_MODE=live|paper, GEMINI_API_KEY (فقط إن فعّلت ai.enabled)
# ============================================================================
symbol: XAUUSD
mode: paper                 # آمن افتراضيًا: تسجيل فقط (لا ترسل إشارات). للتفعيل ضع متغير البيئة BOT_MODE=live أو غيّره هنا.

providers:                  # كل مزوّد بيانات قابل للاستبدال من هنا
  live: swissquote_public    # مصدر عام مجاني بلا API key؛ يبني شموع M1/M5 محليًا
  history: dukascopy         # تاريخ مجاني بلا مفتاح (ملفات ticks ساعية تتحول إلى شموع 1m)
  dukascopy:
    url: https://datafeed.dukascopy.com/datafeed    # الشهر في الرابط يبدأ من 00 (يعالجه الكود)
    instrument: XAUUSD
    price_scale: 1000
    workers: 6
    timeout_sec: 15
    retries: 3
  swissquote:
    url: https://forex-data-feed.swissquote.com/public-quotes/bboquotes/instrument/XAU/USD
    poll_sec: 5
    reconnect_min_sec: 2
    reconnect_max_sec: 60
  oanda:
    instrument: XAU_USD
    rest_url: https://api-fxpractice.oanda.com
    stream_url: https://stream-fxpractice.oanda.com
    oanda_page_limit: 5000
    oanda_max_calls: 80
    oanda_reconnect_min_sec: 2
    oanda_reconnect_max_sec: 60
  csv: {csv_path: data/xauusd_1m.csv}

telegram:
  signal_target: private    # private = محادثتك الخاصة مع البوت | channel = القناة | both = الاثنان
  chart_tf: 5m
  chart_bars: 100

render:
  keepalive_min: 10         # على Render المجاني: ping ذاتي كل N دقيقة حتى لا ينام الخادم (يعمل تلقائيًا مع RENDER_EXTERNAL_URL)

data:
  max_tick_age_sec: 20      # أقدم من هذا = لا صفقة
  history_days: 5          # Dukascopy مجاني وعميق؛ 30 يومًا كافٍ للفريمات العليا
  min_history_rows: 500   # نحو 60 شمعة 4H؛ أقل من ذلك لا يبدأ التحليل
  history_retry_sec: 300
  cache_dir: data/cache
  max_candle_gap_min: 5     # آخر شمعة 1m يجب أن تكون أحدث من هذا وإلا لا صفقة

analysis:
  use_ta_library: true      # مكتبة ta؛ إن لم تعمل يستخدم البوت صيغًا داخلية مكافئة
  swing_lr: 3
  cycle_offset_sec: 3       # تشغيل التحليل بعد إغلاق كل شمعة دقيقة بهذه الثواني

sessions:                   # ساعات UTC [بداية، نهاية). لا يوجد ضبط تلقائي للتوقيت الصيفي
  asia: [0, 8]
  london: [7, 16]
  new_york: [12, 21]
sessions_or_minutes: 30

news:
  auto_feed: true           # جلب تقويم الأخبار آليًا (Forex Factory المجاني، بدون مفتاح) كل refresh_min دقيقة
  refresh_min: 180          # التقويم أسبوعي؛ قلّة الطلبات = أقل حظر 429 (Render يشارك IP مع كثيرين)
  builtin_fallback: true    # إن حُظر التقويم الحي: استخدم NFP + FOMC المدمجين (تغطية جزئية) بدل منع كل الصفقات
  currencies: [USD]         # العملات المؤثرة على الذهب (الدولار)
  ai_fallback: false        # لا نهدر حصة Gemini عند تعطل التقويم؛ غياب التقويم = لا صفقة بأمان
  cache_path: data/news_cache.json
  require_calendar: true    # إن تعذّر التقويم أكثر من max_age_hours: لا صفقة احتياطًا
  max_age_hours: 36
  events_file: data/events.csv   # اختياري: أحداث إضافية يدوية (datetime_utc,name,impact)
  before_min: 30            # قبل الخبر: لا تداول
  after_min: 15             # بعد الخبر: انتظار استقرار السوق

filters:
  min_efficiency_ratio: 0.12
  allow_off_hours: false

strategies:
  enabled: [trend_pullback, liquidity_sweep, breakout, reversal, vwap]
  min_score: 60

confluence:
  min_score: 70
  conflict_margin: 10

probability:
  min_samples: 30           # أقل من هذا = «غير كافٍ» ولا تظهر نسبة
  min_win_rate: 0.50
  min_avg_r: 0.0
  block_if_insufficient: true   # شغّل أولًا: python -m goldbot backtest --tf all --store

risk:
  sl_buffer_atr: 0.25
  min_sl_atr: 0.8
  max_sl_atr: 3.0
  rr1: 1.2
  rr2: 2.4
  min_rr2: 1.8
  max_spread: 0.8           # دولار
  max_spread_to_risk: 0.12
  tp_buffer_atr: 0.1

signals:
  cooldown_min: 30
  max_open_trades: 1

tracking:
  tp1_partial_pct: 0.5      # نسبة الإغلاق عند الهدف الأول (لحساب R)
  max_trade_minutes: 1440

ai:
  enabled: false             # لا حصة خارجية؛ القرار المحلي متعدد الفلاتر يعمل دون Gemini
  model: gemini-3.8-flash   # أقوى نموذج مجاني (الطبقة المجانية: Flash و Flash-Lite فقط؛ نماذج Pro ليست مجانية). يُتجاوز بمتغير GEMINI_MODEL
  fallback_model: gemini-3.7-flash   # يُستخدم تلقائيًا إذا أوقفت Google النموذج الأساسي (404)
  adapter: null             # "your_module:your_function" ← لاستخدام دالة Gemini الحالية عندك كما هي
  on_error: block           # block = لا صفقة عند فشل Gemini | pass = تجاهل الخطأ
  timeout_sec: 30           # مهلة مراجعة الإشارة
  chat_timeout_sec: 15      # مهلة كل استدعاء في محادثة تيليجرام (بعدها ينتقل للنموذج البديل ثم يرد البوت محليًا)
  chat_thinking_level: low  # تفكير أقل = رد أسرع في المحادثة (minimal|low|medium|high)؛ إن رفضه النموذج يُتجاهل تلقائيًا
  review_thinking_level: medium   # مراجعة الإشارات تستحق تفكيرًا أعمق

ml:
  enabled: true             # يُدرَّب تلقائيًا بعد بناء السجل، ولا يتدخل في القرار إلا إذا اجتاز اختبار خارج العينة (AUC ≥ min_oos_auc)
  model_path: data/ml_model.pkl
  min_prob: 0.50
  min_oos_auc: 0.55

bootstrap:                  # تهيئة ذاتية: Backtest ثم تدريب ML في عملية فرعية منخفضة الأولوية
  enabled: true
  days: 60                  # تاريخ Dukascopy عميق ومجاني؛ كلما زادت الأيام زادت عينة الاحتمال التاريخي
  tfs: [5m, 15m]            # أضف 1m إن كان عندك ذاكرة ومعالج كافيان (أبطأ بكثير)
  min_trades: 150           # أقل من هذا في السجل ← يُعاد البناء تلقائيًا
  refresh_days: 7           # تحديث السجل وإعادة تدريب ML كل أسبوع
  timeout_sec: 5400
  marker: data/bootstrap.json

backtest:
  spread: 0.30
  history_days: 60
  steps: {1m: 5, 5m: 1, 15m: 1}
  report_dir: reports

paths:
  journal: data/journal.sqlite
  log_dir: logs
log_level: INFO
